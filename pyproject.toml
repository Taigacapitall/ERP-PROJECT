[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vorpal-business-manager"
version = "0.1.0"
description = "Modular business management system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "SQLAlchemy>=2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = [
    "reportlab>=4",
]
dev = [
    "reportlab>=4",
    "types-reportlab",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["vorpal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Jeu de regles explicite : le jeu par defaut de ruff change d'une version a l'autre.
# E501 (longueur de ligne) n'est volontairement pas selectionne.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "TRY", "ISC"]
ignore = [
    "TRY003",  # messages d'erreur detailles (en francais) ecrits a l'endroit du raise
    "UP042",   # Currency(str, Enum) conserve : StrEnum changerait str(Currency.USD)
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.package-data]
"vorpal.modules.dgi" = ["data/*.json"]
"vorpal.modules.achats" = ["data/*.json"]
"vorpal.modules.adapters.odoo" = ["data/*.json"]
"vorpal.modules.ventes" = ["data/*.json"]
"vorpal.modules.comptabilite" = ["data/*.json"]
