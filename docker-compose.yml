# Environnement de DÉVELOPPEMENT uniquement (identifiants sans valeur de sécurité).
# Démarrer : docker compose up -d db   ·   Arrêter : docker compose down
# URL : postgresql://vorpal:vorpal_dev@localhost:5432/vorpal_dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vorpal
      POSTGRES_PASSWORD: vorpal_dev
      POSTGRES_DB: vorpal_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vorpal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorpal -d vorpal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vorpal_pgdata:
