name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    name: Contrôles (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vorpal
          POSTGRES_PASSWORD: vorpal_ci
          POSTGRES_DB: vorpal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vorpal -d vorpal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Réservé aux tests PostgreSQL (brique B1) : aucun test actuel ne lit cette variable.
      VORPAL_TEST_DATABASE_URL: postgresql://vorpal:vorpal_ci@localhost:5432/vorpal_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags complets (contrôle du Core)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy vorpal

      - name: Core protégé (ajouts seulement par rapport à core-v1)
        # Échoue si le tag core-v1 est absent ou si une ligne existante du Core est supprimée.
        # Sera remplacé par scripts/check_additive_changes.py (brique A4).
        run: |
          git rev-parse --verify --quiet refs/tags/core-v1 >/dev/null \
            || { echo "Tag core-v1 introuvable"; exit 1; }
          git diff --numstat core-v1 -- vorpal/core | tee /tmp/core_numstat.txt
          if awk '$2 > 0 { bad = 1 } END { exit !bad }' /tmp/core_numstat.txt; then
            echo "Le Core contient des lignes supprimées ou modifiées par rapport à core-v1"; exit 1
          fi

      - name: Tests
        run: python -m pytest -q
