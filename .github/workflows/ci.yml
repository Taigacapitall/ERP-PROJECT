name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    name: Contrôles (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vorpal
          POSTGRES_PASSWORD: vorpal_ci
          POSTGRES_DB: vorpal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vorpal -d vorpal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Active les tests PostgreSQL (brique B1) ; sans cette variable ils sont ignorés.
      VORPAL_TEST_DATABASE_URL: postgresql://vorpal:vorpal_ci@127.0.0.1:5432/vorpal_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags complets (contrôle du Core)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy vorpal

      - name: Core protégé (ajouts seulement par rapport à core-v1)
        # Échoue si le tag core-v1 est absent ou si une ligne existante du Core est supprimée.
        run: python scripts/check_additive_changes.py --base core-v1 vorpal/core

      - name: Tests d'architecture
        run: python -m pytest -q tests/plateforme

      - name: Tests
        run: python -m pytest -q
